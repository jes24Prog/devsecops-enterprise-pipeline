# =====================================================================
# SonarQube Community Edition Configuration
# =====================================================================
sonar.projectKey=devsecops-enterprise-pipeline
sonar.projectName=Enterprise DevSecOps Pipeline
sonar.projectVersion=1.0.0

# Source Directories
sonar.sources=src/backend,src/frontend/src
sonar.tests=src/backend/__tests__,src/frontend/src/__tests__
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/monitoring/**,**/docker/**

# Language Configuration
sonar.sourceEncoding=UTF-8
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Quality Gate enforcement options
sonar.qualitygate.wait=true
