# =====================================================================
# GitHub Action Workflow - DISABLED BY DEFAULT
# This workflow will NOT run automatically on push, PR, schedule, or manual trigger.
# To enable manual execution in the future, change "on: []" to "on: [workflow_dispatch]"
# and remove "if: false" from jobs.
# =====================================================================
name: "4. Automated Release Pipeline (Disabled)"

on: []

permissions:
  contents: write
  packages: write

jobs:
  create-release:
    if: false
    name: Create GitHub Release & Publish Release Assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Tagged Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/backend.Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/devsecops-backend:latest

      - name: Create Official GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: 'v1.0.0'
          name: 'Release v1.0.0'
          generate_release_notes: true
          draft: false
          prerelease: false
